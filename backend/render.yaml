services:
  - type: web
    name: continuum-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: 
      - key: SUPABASE_SERVICE_KEY
        value: 
      - key: GROQ_API_KEY
        value: 
      - key: FRONTEND_URL
        value: 
